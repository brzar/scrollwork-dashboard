name: Megaphone data sync

# Keeps the live dashboard's numbers current. Runs entirely on GitHub's
# servers — no local machine needed.
#
# - Podcasts: a quick authenticated request to the deployed app (fast,
#   fits the serverless limit).
# - Metrics: run directly here in Node (no serverless time limit), so even
#   slow Megaphone accounts sync fully. Reads the stored session from
#   Supabase — no Megaphone API token needed.
#
# Cadence: every 30 minutes fits GitHub's free Actions tier.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC)
  workflow_dispatch: {}

concurrency:
  group: megaphone-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync podcasts (via deployed app)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -L --max-time 120 -o /tmp/out -w "%{http_code}" \
            -X GET "$APP_URL/api/admin/sync" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "podcasts: HTTP $code"; cat /tmp/out; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
      - name: Sync metrics (in-runner, no time limit)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run megaphone:sync-metrics
