name: Megaphone refresh + sync

# One job every 30 minutes: re-roll the Megaphone session (Playwright),
# then sync podcasts + metrics. Refreshing on every run keeps the short-
# lived (~75 min) session alive well within its window, and syncing right
# after means the data write always uses a just-minted session.
#
# Runs entirely on GitHub's servers — no machine needed.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC)
  workflow_dispatch: {}

concurrency:
  group: megaphone-sync
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cache the Chromium download so most runs skip the ~100MB install.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 1) Re-roll the session. continue-on-error so a transient refresh
      #    hiccup doesn't block a sync that might still have a valid session.
      - name: Refresh Megaphone sessions
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run megaphone:refresh

      # 2) Sync the podcast list via the deployed app (fast).
      - name: Sync podcasts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -L --max-time 120 -o /tmp/out -w "%{http_code}" \
            -X GET "$APP_URL/api/admin/sync" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "podcasts: HTTP $code"; cat /tmp/out; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      # 3) Sync metrics in-runner (no serverless time limit).
      - name: Sync metrics
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run megaphone:sync-metrics
