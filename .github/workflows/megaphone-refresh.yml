name: Megaphone session refresh

# Keeps the Megaphone web sessions alive (Playwright). Megaphone's cookies
# are short-lived, so we re-roll hourly — each run re-derives fresh cookies
# from the saved login and writes them (plus a refreshed storage_state)
# back to Supabase, which the live dashboard reads from. If a >~1h gap ever
# lets it fully lapse, re-seed once with `npm run megaphone:auth`.

# Scheduling moved into megaphone-sync.yml (refresh + sync run together
# every 30 min). This stays as a manual-only "refresh now" button.
on:
  workflow_dispatch: {} # allow manual run from the Actions tab

concurrency:
  group: megaphone-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh all Megaphone sessions
        run: npm run megaphone:refresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
