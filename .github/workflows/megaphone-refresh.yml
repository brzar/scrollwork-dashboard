name: Megaphone session refresh

# Keeps the Megaphone web sessions alive (Playwright). The session lasts
# ~24h, so every 6 hours is plenty. Writes the refreshed cookies to
# Supabase, which the live dashboard reads from.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch: {} # allow manual run from the Actions tab

concurrency:
  group: megaphone-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh all Megaphone sessions
        run: npm run megaphone:refresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
